<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy-型錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .toast-animate { animation: slideDown 0.3s ease-out forwards; }
        /* Modal 淡入動畫 */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-animate { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-200">

    <!-- 🌟 圖片放大預覽 Modal -->
    <div id="imageModal" class="hidden fixed inset-0 z-[200] bg-black bg-opacity-90 flex items-center justify-center p-4 modal-animate" onclick="closeImageModal()">
        <span class="absolute top-4 right-4 text-white text-4xl cursor-pointer hover:text-gray-300 transition" onclick="closeImageModal()">&times;</span>
        <img id="expandedImg" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl">
    </div>

    <!-- 🌟 老闆娘專屬密碼輸入 Modal -->
    <div id="passwordModal" class="hidden fixed inset-0 z-[150] bg-black bg-opacity-60 flex items-center justify-center p-4 modal-animate">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-all">
            <div class="text-center mb-5">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl shadow-sm">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <!-- 🌟 已經將標題改為純意境文字 -->
                <h3 class="text-lg font-bold text-gray-800 tracking-wide">心之所向終能抵達</h3>
            </div>
            <input type="password" id="adminPasswordInput" class="w-full border border-gray-300 rounded-xl p-3.5 mb-5 focus:ring-2 focus:ring-indigo-500 outline-none text-center tracking-widest text-lg" placeholder="請輸入密碼" onkeypress="if(event.key === 'Enter') verifyPassword()">
            <div class="flex justify-between gap-3">
                <button onclick="closePasswordModal()" class="w-1/2 py-3 rounded-xl text-gray-600 bg-gray-100 hover:bg-gray-200 font-bold transition active:scale-95">取消</button>
                <button onclick="verifyPassword()" class="w-1/2 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition shadow-sm active:scale-95">確認</button>
            </div>
        </div>
    </div>

    <!-- 管理模式切換列 -->
    <div id="adminToggleBar" class="hidden bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-white font-bold flex items-center gap-2">
                <i class="fa-solid fa-user-shield text-[#06C755]"></i> 管理模式
            </div>
            <div class="flex bg-gray-700 rounded-full p-1">
                <button id="btnAdmin" onclick="switchView('admin')" class="px-4 py-2 rounded-full text-sm font-bold transition-all bg-indigo-600 text-white shadow-sm flex items-center gap-1">
                    <i class="fa-solid fa-box-open"></i> 後台管理
                </button>
                <button id="btnCustomer" onclick="switchView('customer')" class="px-4 py-2 rounded-full text-sm font-bold transition-all bg-transparent text-gray-300 hover:text-white flex items-center gap-1">
                    <i class="fa-solid fa-mobile-screen"></i> 預覽型錄
                </button>
            </div>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="w-full pb-20">

        <!-- ========================================== -->
        <!-- 模式 B：客人看型錄 -->
        <!-- ========================================== -->
        <div id="viewCustomer" class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-xl relative">
            <div class="bg-white px-4 py-4 shadow-sm sticky top-0 z-40 flex justify-between items-center">
                <div class="font-bold text-lg text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-store text-indigo-600"></i>
                    <span id="customerShopName">西門町Candy服飾</span>
                </div>
                <!-- 🔒 秘密通道 -->
                <button onclick="openPasswordModal()" id="btnLock" class="text-gray-300 hover:text-indigo-500 transition p-2">
                    <i class="fa-solid fa-lock"></i>
                </button>
            </div>

            <div class="bg-rose-50 text-rose-600 text-xs py-2 px-4 text-center font-bold shadow-inner flex justify-center items-center gap-1">
                <i class="fa-solid fa-circle-exclamation"></i> 現貨有限，看中請立刻點按鈕私訊保留！
            </div>

            <div id="customerProductList" class="p-4 flex flex-col gap-5 pb-20">
                <div class="p-8 text-center text-gray-400 bg-white rounded-2xl border border-dashed border-gray-200 mt-10">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>店鋪資料讀取中...
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 模式 A：老闆娘後台 -->
        <!-- ========================================== -->
        <div id="viewAdmin" class="hidden max-w-4xl mx-auto px-4 py-6 space-y-6">
            
            <div class="bg-indigo-50 border border-indigo-200 text-indigo-800 p-4 rounded-xl flex items-start gap-3 shadow-sm">
                <i class="fa-solid fa-seedling mt-1 text-indigo-600"></i>
                <div>
                    <strong class="block mb-1">歡迎回來，老闆娘！</strong>
                    <!-- 🌟 更新為您專屬的語錄 -->
                    <p class="text-sm leading-relaxed font-medium">真正改變人生的，從來不是奇蹟，而是日復一日的累積。</p>
                </div>
            </div>

            <!-- 設定區 -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <h3 class="font-bold text-indigo-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-gear"></i> 店鋪基本設定</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">店鋪名稱</label>
                        <input type="text" id="inputShopName" value="西門町Candy服飾" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">客服 LINE 網址</label>
                        <input type="text" id="inputLineLink" placeholder="例如: https://line.me/ti/p/您的ID" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button id="btnSaveSettings" onclick="saveSettings()" class="w-full bg-indigo-600 text-white font-bold text-base py-3 rounded-xl flex justify-center items-center gap-2 shadow-sm hover:bg-indigo-700 active:scale-[0.98] transition">
                        <i class="fa-solid fa-floppy-disk"></i> 永久儲存設定
                    </button>
                </div>
            </div>

            <!-- 上架區 -->
            <div class="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden">
                <div class="bg-[#06C755] text-white p-4 flex items-center gap-2">
                    <i class="fa-solid fa-camera text-xl"></i><h2 class="text-lg font-bold">新增商品</h2>
                </div>
                <div class="p-5 flex flex-col md:flex-row gap-6">
                    <div class="w-full md:w-1/3 border-2 border-dashed border-gray-300 rounded-2xl p-2 flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50 transition relative min-h-[280px]" onclick="document.getElementById('fileInput').click()">
                        <img id="imgPreview" src="" class="w-full h-full object-cover rounded-xl absolute inset-0 hidden">
                        <div id="uploadPlaceholder" class="text-center p-4">
                            <div class="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center mx-auto mb-3">
                                <i class="fa-regular fa-image text-3xl text-[#06C755]"></i>
                            </div>
                            <span class="text-gray-600 font-bold block">點擊上傳照片</span>
                        </div>
                        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="previewImage(event)">
                    </div>

                    <div class="w-full md:w-2/3 flex flex-col justify-between">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">商品名稱 <span class="text-red-500">*</span></label>
                                <input type="text" id="inputTitle" placeholder="例如：手提愛心長夾" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-[#06C755] outline-none">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">價格 (NT$) <span class="text-red-500">*</span></label>
                                <input type="number" id="inputPrice" placeholder="例如：200" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-[#06C755] outline-none">
                            </div>

                            <div class="relative">
                                <div class="flex justify-between items-end mb-1">
                                    <label class="block text-sm font-bold text-gray-700">產品介紹</label>
                                    <button type="button" onclick="generateCopywriting()" class="text-xs bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full font-bold hover:bg-purple-200 transition flex items-center gap-1 shadow-sm active:scale-95">
                                        <i class="fa-solid fa-wand-magic-sparkles"></i> 點我一鍵生文案
                                    </button>
                                </div>
                                <textarea id="inputDesc" class="w-full border border-gray-300 rounded-xl p-3 resize-none focus:ring-2 focus:ring-[#06C755] outline-none" rows="3" placeholder="按右上角一鍵生文案，或是自己打字喔！"></textarea>
                            </div>
                        </div>

                        <button id="btnPublish" class="mt-4 w-full bg-[#06C755] text-white font-bold text-lg py-4 rounded-xl flex justify-center items-center gap-2 shadow-md hover:bg-green-600 transition" onclick="publishProduct()">
                            <i class="fa-solid fa-paper-plane"></i> 立即上架
                        </button>
                    </div>
                </div>
            </div>

            <!-- 列表區 -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-gray-700 flex items-center gap-2"><i class="fa-solid fa-box"></i> 已上架商品管理</h3>
                    <button onclick="forceRefresh()" class="text-xs bg-indigo-100 text-indigo-700 px-4 py-2 rounded-full hover:bg-indigo-200 transition font-bold shadow-sm flex items-center gap-1 active:scale-95">
                        <i class="fa-solid fa-rotate-right"></i> 點我重新讀取
                    </button>
                </div>
                <div id="adminProductList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, getDocs, addDoc, deleteDoc, doc, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFLjVGT5kkThgxuWpdeLbqNLzYKiWB6CA",
            authDomain: "candyshop-568cc.firebaseapp.com",
            projectId: "candyshop-568cc",
            storageBucket: "candyshop-568cc.firebasestorage.app",
            messagingSenderId: "949351610794",
            appId: "1:949351610794:web:89794d9dac453d48c493d3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.productsData = [];
        let base64Image = null;

        // 提示框
        window.showToast = function(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-10 left-1/2 z-[100] px-6 py-3 rounded-full shadow-lg text-white font-bold text-sm tracking-wide toast-animate whitespace-nowrap ${type === 'success' ? 'bg-[#06C755]' : (type === 'purple' ? 'bg-indigo-600' : 'bg-red-500')}`;
            toast.innerHTML = type === 'success' ? `<i class="fa-solid fa-check-circle mr-2"></i>${message}` : `<i class="fa-solid fa-circle-exclamation mr-2"></i>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        };

        // 🌟 放大圖片功能
        window.openImageModal = function(url) {
            document.getElementById('expandedImg').src = url;
            document.getElementById('imageModal').classList.remove('hidden');
        };
        window.closeImageModal = function() {
            document.getElementById('imageModal').classList.add('hidden');
        };

        // 🌟 美化的密碼輸入框功能
        window.openPasswordModal = function() {
            document.getElementById('passwordModal').classList.remove('hidden');
            document.getElementById('adminPasswordInput').value = '';
            setTimeout(() => document.getElementById('adminPasswordInput').focus(), 100);
        };
        window.closePasswordModal = function() {
            document.getElementById('passwordModal').classList.add('hidden');
        };
        window.verifyPassword = function() {
            const pwd = document.getElementById('adminPasswordInput').value;
            if (pwd === "1101") {
                closePasswordModal();
                showToast("密碼正確！歡迎進入後台");
                document.getElementById('adminToggleBar').classList.remove('hidden');
                document.getElementById('btnLock').classList.add('hidden');
                switchView('admin');
            } else {
                showToast("密碼錯誤！", "error");
                document.getElementById('adminPasswordInput').value = '';
                document.getElementById('adminPasswordInput').focus();
            }
        };

        // 店鋪設定
        const settingsRef = doc(db, 'settings', 'shopInfo');
        onSnapshot(settingsRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if(document.getElementById('inputShopName')) document.getElementById('inputShopName').value = data.shopName || '西門町Candy服飾';
                if(document.getElementById('inputLineLink')) document.getElementById('inputLineLink').value = data.lineLink || '';
                renderProducts(); 
            }
        });

        window.saveSettings = async function() {
            const shopName = document.getElementById('inputShopName').value.trim();
            const lineLink = document.getElementById('inputLineLink').value.trim();
            const btn = document.getElementById('btnSaveSettings');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 儲存中...';
            btn.disabled = true;

            try {
                await setDoc(doc(db, 'settings', 'shopInfo'), { shopName: shopName, lineLink: lineLink });
                showToast("✨ 店鋪設定已永久儲存！", "purple");
            } catch (err) {
                showToast(`儲存失敗`, "error");
            }
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 永久儲存設定';
            btn.disabled = false;
        };

        // 讀取資料
        function processAndSortData(snapshot) {
            const fetched = [];
            snapshot.forEach(doc => fetched.push({ id: doc.id, ...doc.data() }));
            fetched.sort((a, b) => {
                const timeA = a.createdAt ? (typeof a.createdAt.toMillis === 'function' ? a.createdAt.toMillis() : Date.now()) : 0;
                const timeB = b.createdAt ? (typeof b.createdAt.toMillis === 'function' ? b.createdAt.toMillis() : Date.now()) : 0;
                return timeB - timeA;
            });
            return fetched;
        }

        const productsRef = collection(db, 'products');
        onSnapshot(productsRef, (snapshot) => {
            window.productsData = processAndSortData(snapshot);
            renderProducts();
        }, (error) => {
            console.error("資料庫讀取錯誤", error);
        });

        window.forceRefresh = async function() {
            showToast("🔄 讀取中...");
            try {
                const querySnapshot = await getDocs(productsRef);
                window.productsData = processAndSortData(querySnapshot);
                renderProducts();
                showToast("✅ 讀取成功！");
            } catch (e) {
                showToast("抓取失敗", "error");
            }
        };

        // 上架功能
        window.previewImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const MAX = 600; 
                    if (width > height) { if (width > MAX) { height *= MAX / width; width = MAX; } } 
                    else { if (height > MAX) { width *= MAX / height; height = MAX; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    base64Image = canvas.toDataURL('image/jpeg', 0.6); 
                    document.getElementById('imgPreview').src = base64Image;
                    document.getElementById('imgPreview').classList.remove('hidden');
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                }
            };
            reader.readAsDataURL(file);
        };

        window.generateCopywriting = function() {
            const title = document.getElementById('inputTitle').value;
            const descField = document.getElementById('inputDesc');
            if (!title) { showToast("老闆娘，請先輸入「商品名稱」喔！", "error"); return; }
            descField.value = "🤖 正在為您寫厲害的銷售文案...";
            setTimeout(() => {
                let desc = "這款實品真的超級美！摸到材質妳一定會愛上，版型超修飾，穿起來質感滿分💯。現貨數量有限，喜歡趕快帶回家～"; 
                if (title.includes('褲')) desc = "超有垂墜感！走路都有風，材質軟Ｑ舒服，鬆緊褲頭超好穿，完美修飾馬鞍肉跟小腹！現貨不用等，絕對要包色啊❤️";
                else if (title.includes('洋裝') || title.includes('裙')) desc = "這款版型超修飾肚子跟大腿！布料親膚透氣，套一件就能出門，姊妹聚會穿這件絕對被誇獎～現貨有限，喜歡快喊保留！";
                else if (title.includes('衫') || title.includes('衣') || title.includes('T')) desc = "布料超親膚透氣，夏天穿完全不悶熱！隨便搭個褲子或裙子就超好看，日常出門必備的顯瘦百搭款，真心推薦👍";
                else if (title.includes('包') || title.includes('夾')) desc = "實體質感超好，夾層很多超級實用！出門帶它剛剛好，百搭又時尚。這批賣完不知道什麼時候才會再補，要買要快喔！";
                else if (title.includes('套裝')) desc = "一套幫妳搭好，出門免煩惱！材質親膚舒服，分開搭其他衣服也好看，CP值超高。實體攤位也是賣翻天，現貨快搶！";
                descField.value = desc;
                descField.classList.add('ring-2', 'ring-purple-400', 'bg-purple-50');
                setTimeout(() => descField.classList.remove('ring-2', 'ring-purple-400', 'bg-purple-50'), 500);
            }, 300); 
        };

        window.publishProduct = async function() {
            const title = document.getElementById('inputTitle').value.trim();
            const price = document.getElementById('inputPrice').value.trim();
            const desc = document.getElementById('inputDesc').value.trim();

            if (!base64Image || !title || !price) { showToast("照片、名稱、價格都要填喔！", "error"); return; }
            
            document.getElementById('btnPublish').innerText = '資料上傳中...';
            document.getElementById('btnPublish').disabled = true;

            try {
                await addDoc(collection(db, 'products'), {
                    imageUrl: base64Image, title: title, price: price, rawText: desc, soldCount: Math.floor(Math.random() * 40) + 10, createdAt: serverTimestamp()
                });
                
                document.getElementById('inputTitle').value = ''; document.getElementById('inputPrice').value = ''; document.getElementById('inputDesc').value = '';
                base64Image = null; document.getElementById('imgPreview').classList.add('hidden'); document.getElementById('uploadPlaceholder').classList.remove('hidden'); document.getElementById('fileInput').value = '';
                showToast("🎉 上架成功！");
            } catch (err) {
                showToast("上架失敗，請確認網路", "error");
            }
            document.getElementById('btnPublish').innerHTML = '<i class="fa-solid fa-paper-plane"></i> 立即上架';
            document.getElementById('btnPublish').disabled = false;
        };

        window.deleteProduct = async function(id) {
            if(confirm("確定要下架刪除這件商品嗎？")) {
                await deleteDoc(doc(db, 'products', id));
            }
        };

        window.buyProduct = function() {
            const link = document.getElementById('inputLineLink') ? document.getElementById('inputLineLink').value : '';
            if(link) window.open(link, '_blank');
            else showToast("老闆娘還沒設定 LINE 連結喔！", "error");
        };

        // 渲染畫面
        function renderProducts() {
            const adminList = document.getElementById('adminProductList');
            const customerList = document.getElementById('customerProductList');
            if(adminList) adminList.innerHTML = ''; 
            if(customerList) customerList.innerHTML = '';

            const shopInput = document.getElementById('inputShopName');
            const shopName = shopInput ? shopInput.value : '西門町Candy服飾';
            const customerShopName = document.getElementById('customerShopName');
            if (customerShopName) customerShopName.innerText = shopName;

            if (window.productsData.length === 0) {
                if(adminList) adminList.innerHTML = '<div class="col-span-full p-6 text-center text-gray-400 bg-white rounded-xl border border-dashed border-gray-300">還沒有商品！</div>';
                if(customerList) customerList.innerHTML = '<div class="p-8 text-center text-gray-400 bg-white rounded-2xl border border-dashed border-gray-200 mt-10">老闆娘補貨中...</div>';
                return;
            }

            window.productsData.forEach(p => {
                if(adminList) {
                    adminList.innerHTML += `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex overflow-hidden">
                            <!-- 🌟 後台圖片加入點擊放大功能 -->
                            <img src="${p.imageUrl}" class="w-24 h-24 object-cover flex-shrink-0 bg-gray-100 cursor-pointer" onclick="openImageModal('${p.imageUrl}')">
                            <div class="p-3 flex-1 flex flex-col justify-between">
                                <div>
                                    <h4 class="font-bold text-gray-800 text-sm line-clamp-1">${p.title}</h4>
                                    <div class="text-rose-600 font-bold mt-1">NT$ ${p.price}</div>
                                </div>
                                <div class="text-right mt-2">
                                    <button onclick="deleteProduct('${p.id}')" class="text-red-500 hover:bg-red-50 px-2 py-1 rounded text-sm transition font-bold"><i class="fa-solid fa-trash"></i> 下架</button>
                                </div>
                            </div>
                        </div>`;
                }

                const descHtml = p.rawText ? `<div class="bg-gray-50 p-3 rounded-xl text-sm text-gray-600 mb-4 whitespace-pre-wrap leading-relaxed">${p.rawText}</div>` : `<div class="mb-2"></div>`;

                if(customerList) {
                    customerList.innerHTML += `
                        <div class="bg-white rounded-2xl shadow-md overflow-hidden">
                            <div class="aspect-[4/5] w-full bg-gray-100 relative group">
                                <!-- 🌟 前台圖片加入點擊放大功能 -->
                                <img src="${p.imageUrl}" class="w-full h-full object-cover cursor-pointer" onclick="openImageModal('${p.imageUrl}')">
                                <div class="absolute top-3 left-3 bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-lg">🔥 已售出 ${p.soldCount} 件</div>
                                <div class="absolute bottom-2 right-2 bg-black bg-opacity-50 text-white p-1.5 rounded-full opacity-75 pointer-events-none">
                                    <i class="fa-solid fa-magnifying-glass-plus text-sm"></i>
                                </div>
                            </div>
                            <div class="p-4">
                                <h2 class="text-lg font-bold text-gray-800 mb-1">${p.title}</h2>
                                <div class="text-2xl font-bold text-rose-600 mb-3">NT$ ${p.price}</div>
                                ${descHtml}
                                <button onclick="buyProduct()" class="w-full bg-[#06C755] text-white font-bold text-base py-3.5 rounded-xl flex justify-center items-center gap-2 shadow-sm active:scale-95 transition">
                                    <i class="fa-brands fa-line text-xl"></i> 點我傳 LINE 詢問
                                </button>
                            </div>
                        </div>`;
                }
            });
        }

        window.switchView = function(mode) {
            const vAdmin = document.getElementById('viewAdmin');
            const vCustomer = document.getElementById('viewCustomer');
            const btnAdmin = document.getElementById('btnAdmin');
            const btnCustomer = document.getElementById('btnCustomer');

            if (mode === 'admin') {
                if(vAdmin) vAdmin.classList.remove('hidden'); 
                if(vCustomer) vCustomer.classList.add('hidden');
                if(btnAdmin) btnAdmin.className = "px-4 py-2 rounded-full text-sm font-bold transition-all bg-indigo-600 text-white shadow-sm flex items-center gap-1";
                if(btnCustomer) btnCustomer.className = "px-4 py-2 rounded-full text-sm font-bold transition-all bg-transparent text-gray-300 hover:text-white flex items-center gap-1";
            } else {
                if(vAdmin) vAdmin.classList.add('hidden'); 
                if(vCustomer) vCustomer.classList.remove('hidden');
                if(btnCustomer) btnCustomer.className = "px-4 py-2 rounded-full text-sm font-bold transition-all bg-[#06C755] text-white shadow-sm flex items-center gap-1";
                if(btnAdmin) btnAdmin.className = "px-4 py-2 rounded-full text-sm font-bold transition-all bg-transparent text-gray-300 hover:text-white flex items-center gap-1";
                renderProducts();
            }
        };
    </script>
</body>
</html>
