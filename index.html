<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>代購旗艦系統</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInBg { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    .animate-fade-in-bg { animation: fadeInBg 0.2s ease-out; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    body { -webkit-tap-highlight-color: transparent; }
    input::-webkit-calendar-picker-indicator { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    const Icon = ({ name, size = 16, className = '' }) => (
      <i className={`fa-solid fa-${name} ${className}`} style={{ fontSize: `${size}px` }}></i>
    );

    const STATUSES = {
      PENDING_BUY: { id: 'pending_buy', label: '待叫貨', color: 'bg-red-100 text-red-700', next: 'ordered', actionLabel: '標記已叫貨' },
      ORDERED: { id: 'ordered', label: '已叫貨', color: 'bg-yellow-100 text-yellow-700', next: 'received', actionLabel: '標記已到貨' },
      RECEIVED: { id: 'received', label: '已到貨', color: 'bg-blue-100 text-blue-700', next: 'shipped', actionLabel: '標記已出貨' },
      SHIPPED: { id: 'shipped', label: '已出貨', color: 'bg-purple-100 text-purple-700', next: 'completed', actionLabel: '確認已收款' },
      COMPLETED: { id: 'completed', label: '已完成', color: 'bg-green-100 text-green-700', next: null, actionLabel: '' }
    };

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          console.error(error);
          return initialValue;
        }
      });

      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(storedValue));
        } catch (error) {
          if(error.name === 'QuotaExceededError') {
            alert('手機瀏覽器儲存空間已滿！建議進行「備份」，然後刪除一些舊歷史訂單。');
          }
        }
      }, [key, storedValue]);

      return [storedValue, setStoredValue];
    }

    const splitOptions = (str) => {
      if (!str) return [];
      return str.split(/[\/／,，、\s]+/).map(s => s.trim()).filter(Boolean);
    };

    function App() {
      const [activeTab, setActiveTab] = useState('products');
      
      const [products, setProducts] = useLocalStorage('daigou_products_v1', []);
      const [orders, setOrders] = useLocalStorage('daigou_orders_v1', []);

      const [showAddProduct, setShowAddProduct] = useState(false);
      const [editingProductId, setEditingProductId] = useState(null); 
      
      const [showAddOrder, setShowAddOrder] = useState(false);
      const [editingOrderId, setEditingOrderId] = useState(null); 
      const [selectedProductForOrder, setSelectedProductForOrder] = useState(null);
      
      const [newProduct, setNewProduct] = useState({ name: '', cost: '', price: '', styles: '', sizes: '', image: null });
      const [newOrder, setNewOrder] = useState({ customer: '', style: '', size: '', quantity: 1 });
      
      const [orderSearch, setOrderSearch] = useState('');
      const [orderFilterStatus, setOrderFilterStatus] = useState('all');
      const [orderViewMode, setOrderViewMode] = useState('time'); 

      const [viewCustomer, setViewCustomer] = useState(null);
      const [viewProductInfo, setViewProductInfo] = useState(null);

      const fileInputRef = useRef(null);
      const importInputRef = useRef(null);

      const uniqueCustomers = useMemo(() => {
        const names = orders.map(o => o.customer);
        return [...new Set(names)].filter(Boolean).sort();
      }, [orders]);

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 400; 
            let scaleSize = 1;
            if (img.width > MAX_WIDTH) {
              scaleSize = MAX_WIDTH / img.width;
            }
            canvas.width = img.width * scaleSize;
            canvas.height = img.height * scaleSize;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
            setNewProduct({ ...newProduct, image: compressedDataUrl });
          };
        };
      };

      const downloadBackup = () => {
        const backupData = {
          version: '1.0',
          date: new Date().toISOString(),
          products: products,
          orders: orders
        };
        const blob = new Blob([JSON.stringify(backupData)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const today = new Date().toISOString().split('T')[0];
        a.download = `代購系統備份_${today}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('備份檔下載成功！\n請選擇儲存到您的「檔案」或「Google 雲端硬碟」中。');
      };

      const handleImportBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.products && Array.isArray(data.products) && data.orders && Array.isArray(data.orders)) {
              if(window.confirm('確定要還原備份嗎？這會覆蓋掉目前所有的資料喔！')) {
                setProducts(data.products);
                setOrders(data.orders);
                alert('資料還原成功！');
              }
            } else {
              alert('檔案格式錯誤，這不是有效的備份檔。');
            }
          } catch (error) {
            alert('讀取檔案失敗。');
          }
          if(importInputRef.current) importInputRef.current.value = '';
        };
        reader.readAsText(file);
      };

      const closeProductModal = () => {
        setShowAddProduct(false);
        setEditingProductId(null);
        setNewProduct({ name: '', cost: '', price: '', styles: '', sizes: '', image: null });
      };

      const editProduct = (product) => {
        setNewProduct({
          name: product.name,
          cost: product.cost,
          price: product.price,
          styles: product.styles ? product.styles.join('/') : '',
          sizes: product.sizes ? product.sizes.join('/') : '',
          image: product.image
        });
        setEditingProductId(product.id);
        setShowAddProduct(true);
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        
        const productData = {
          name: newProduct.name.trim(),
          cost: Number(newProduct.cost),
          price: Number(newProduct.price),
          styles: splitOptions(newProduct.styles),
          sizes: splitOptions(newProduct.sizes),
          image: newProduct.image
        };

        if (editingProductId) {
          setProducts(products.map(p => p.id === editingProductId ? { ...p, ...productData } : p));
        } else {
          productData.id = `p${Date.now()}`;
          setProducts([productData, ...products]);
        }
        
        closeProductModal();
      };

      const deleteProduct = (id) => {
        if(window.confirm('確定刪除此商品？(已接單的紀錄不會受影響)')) {
          setProducts(products.filter(p => p.id !== id));
        }
      };

      const closeOrderModal = () => {
        setShowAddOrder(false);
        setEditingOrderId(null);
        setSelectedProductForOrder(null);
        setNewOrder({ customer: '', style: '', size: '', quantity: 1 });
      };

      const openOrderForm = (product) => {
        setSelectedProductForOrder(product);
        setNewOrder({ 
          customer: '', 
          style: product.styles && product.styles.length > 0 ? product.styles[0] : '', 
          size: product.sizes && product.sizes.length > 0 ? product.sizes[0] : '', 
          quantity: 1 
        });
        setEditingOrderId(null);
        setShowAddOrder(true);
      };

      const editOrder = (order, product) => {
        setSelectedProductForOrder(product);
        setNewOrder({
          customer: order.customer,
          style: order.style || '',
          size: order.size || '',
          quantity: order.quantity
        });
        setEditingOrderId(order.id);
        setShowAddOrder(true);
      };

      const handleSaveOrder = (e) => {
        e.preventDefault();
        
        if (editingOrderId) {
          setOrders(orders.map(o => o.id === editingOrderId ? {
            ...o,
            customer: newOrder.customer.trim(),
            style: newOrder.style,
            size: newOrder.size,
            quantity: Number(newOrder.quantity)
          } : o));
        } else {
          const order = {
            id: `o${Date.now()}`, 
            productId: selectedProductForOrder.id, 
            customer: newOrder.customer.trim(),
            style: newOrder.style, 
            size: newOrder.size, 
            quantity: Number(newOrder.quantity), 
            status: 'pending_buy', 
            date: new Date().toISOString().split('T')[0]
          };
          setOrders([order, ...orders]);
        }
        closeOrderModal();
      };

      const deleteOrder = (id) => {
        if(window.confirm('確定刪除此客訂紀錄？')) setOrders(orders.filter(o => o.id !== id));
      };

      const advanceOrderStatus = (id, currentStatus) => {
        const nextStatus = STATUSES[currentStatus.toUpperCase()].next;
        if (nextStatus) {
          setOrders(orders.map(o => o.id === id ? { ...o, status: nextStatus } : o));
        }
      };

      const batchMarkAsOrdered = (productId, style, size) => {
        setOrders(orders.map(o => {
          if (o.status === 'pending_buy' && o.productId === productId && o.style === style && o.size === size) {
            return { ...o, status: 'ordered' };
          }
          return o;
        }));
      };

      // --- 衍生資料運算與排序 ---
      const sortedProducts = useMemo(() => {
        return [...products].sort((a, b) => {
          return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
        });
      }, [products]);

      const allEnrichedOrders = useMemo(() => {
        return orders.map(order => {
          const product = products.find(p => p.id === order.productId) || { name: '已刪除商品', image: null, cost: 0, price: 0, styles: [], sizes: [] };
          return { ...order, product };
        }).sort((a, b) => b.id.localeCompare(a.id));
      }, [orders, products]);

      const enrichedOrders = useMemo(() => {
        return allEnrichedOrders.filter(order => {
          const matchTab = orderFilterStatus === 'all' || order.status === orderFilterStatus;
          const matchSearch = order.customer.includes(orderSearch) || order.product.name.includes(orderSearch);
          return matchTab && matchSearch;
        });
      }, [allEnrichedOrders, orderFilterStatus, orderSearch]);

      const customerSummaries = useMemo(() => {
        const grouped = {};
        enrichedOrders.forEach(order => {
          if (!grouped[order.customer]) {
            grouped[order.customer] = {
              customer: order.customer,
              totalItems: 0,
              unpaidTotal: 0,
              completedItems: 0,
              orders: []
            };
          }
          grouped[order.customer].orders.push(order);
          grouped[order.customer].totalItems += order.quantity;
          
          if (order.status !== 'completed') {
            grouped[order.customer].unpaidTotal += (order.product.price * order.quantity);
          } else {
            grouped[order.customer].completedItems += order.quantity;
          }
        });
        
        return Object.values(grouped).sort((a, b) => b.unpaidTotal - a.unpaidTotal);
      }, [enrichedOrders]);

      const purchasingList = useMemo(() => {
        const pending = orders.filter(o => o.status === 'pending_buy');
        const grouped = {};
        
        pending.forEach(order => {
          const product = products.find(p => p.id === order.productId) || { name: '已刪除商品', image: null, cost: 0 };
          const key = `${order.productId}_${order.style}_${order.size}`;
          
          if (!grouped[key]) {
            grouped[key] = {
              productId: order.productId, productName: product.name, image: product.image, cost: product.cost,
              style: order.style, size: order.size, totalQuantity: 0, customers: []
            };
          }
          grouped[key].totalQuantity += order.quantity;
          
          // 計算單一規格要準備多少錢叫貨
          grouped[key].itemSubtotal = grouped[key].totalQuantity * product.cost;
          
          grouped[key].customers.push({ name: order.customer, qty: order.quantity });
        });
        
        return Object.values(grouped).sort((a, b) => {
          return a.productName.localeCompare(b.productName, undefined, { numeric: true, sensitivity: 'base' });
        });
      }, [orders, products]);

      const stats = useMemo(() => {
        let expectedProfit = 0;
        let totalUnpaid = 0;
        let pendingCost = 0; // 這批叫貨總成本
        
        orders.forEach(order => {
          const product = products.find(p => p.id === order.productId);
          if (product) {
            if (order.status !== 'completed') totalUnpaid += (product.price * order.quantity);
            if (order.status === 'pending_buy') pendingCost += (product.cost * order.quantity);
            expectedProfit += ((product.price - product.cost) * order.quantity);
          }
        });
        return { expectedProfit, totalUnpaid, pendingCost, pendingCount: purchasingList.length };
      }, [orders, products, purchasingList]);

      // --- 渲染共用彈窗 ---
      const renderCustomerModal = () => {
        if (!viewCustomer) return null;
        const customerOrders = allEnrichedOrders.filter(o => o.customer === viewCustomer);
        const unpaidTotal = customerOrders.reduce((sum, o) => o.status !== 'completed' ? sum + (o.product.price * o.quantity) : sum, 0);

        return (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end justify-center animate-fade-in-bg">
            <div className="bg-white w-full rounded-t-2xl shadow-xl overflow-hidden max-h-[85vh] flex flex-col animate-fade-in">
              <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-blue-50/50 sticky top-0 z-10">
                <div>
                  <h3 className="font-extrabold text-xl flex items-center gap-2">
                    <Icon name="user" className="text-blue-600"/> {viewCustomer} <span className="text-sm font-normal text-slate-500">的清單</span>
                  </h3>
                  <div className="text-xs font-bold text-red-500 mt-1">未結清總額: ${unpaidTotal.toLocaleString()}</div>
                </div>
                <button onClick={() => setViewCustomer(null)} className="w-8 h-8 bg-slate-200 rounded-full text-slate-600 flex items-center justify-center hover:bg-slate-300"><Icon name="xmark" /></button>
              </div>
              <div className="overflow-y-auto p-4 space-y-3 bg-slate-50 pb-10">
                {customerOrders.length === 0 && <div className="text-center text-slate-400 py-4">無資料</div>}
                {customerOrders.map(order => {
                  const statusConfig = STATUSES[order.status.toUpperCase()];
                  return (
                    <div key={order.id} className="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex gap-3">
                      {order.product.image ? (
                        <img src={order.product.image} className="w-16 h-16 rounded-lg object-cover shrink-0" alt="img" />
                      ) : (
                        <div className="w-16 h-16 rounded-lg bg-slate-50 flex items-center justify-center shrink-0"><Icon name="box" className="text-slate-300"/></div>
                      )}
                      <div className="flex-1 min-w-0 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between">
                            <h4 className="font-bold text-slate-800 text-sm truncate">{order.product.name}</h4>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0 ${statusConfig.color}`}>{statusConfig.label}</span>
                          </div>
                          <div className="text-[11px] text-slate-500 mt-0.5">
                            {order.style && <span className="mr-2">款: {order.style}</span>}
                            {order.size && <span>碼: {order.size}</span>}
                          </div>
                        </div>
                        
                        <div className="flex justify-between items-end mt-2">
                          <div className="flex flex-col gap-0.5">
                            <div className="text-[10px] text-slate-400">
                              批: ${order.product.cost} × {order.quantity} = <span className="font-bold">${order.product.cost * order.quantity}</span>
                            </div>
                            <div className="text-xs font-bold text-slate-700">
                              售: ${order.product.price} × {order.quantity} = <span className="font-black text-slate-800">${order.product.price * order.quantity}</span>
                            </div>
                          </div>
                          <div className="flex items-center gap-2 mb-0.5">
                            {statusConfig.next && (
                              <button onClick={() => advanceOrderStatus(order.id, order.status)} className="text-[10px] bg-slate-800 text-white px-2 py-1 rounded-md active:bg-slate-700">
                                {statusConfig.actionLabel}
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      };

      const renderProductModal = () => {
        if (!viewProductInfo) return null;
        const productOrders = allEnrichedOrders.filter(o => o.productId === viewProductInfo.id);
        const totalOrdered = productOrders.reduce((sum, o) => sum + o.quantity, 0);

        return (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end justify-center animate-fade-in-bg">
            <div className="bg-white w-full rounded-t-2xl shadow-xl overflow-hidden max-h-[85vh] flex flex-col animate-fade-in">
              <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 sticky top-0 z-10">
                <div className="flex items-center gap-3">
                  {viewProductInfo.image && <img src={viewProductInfo.image} className="w-10 h-10 rounded object-cover" />}
                  <div>
                    <h3 className="font-extrabold text-lg text-slate-800 line-clamp-1">{viewProductInfo.name}</h3>
                    <div className="text-xs font-bold text-slate-500">總接單數: {totalOrdered} 件</div>
                  </div>
                </div>
                <button onClick={() => setViewProductInfo(null)} className="w-8 h-8 bg-slate-200 rounded-full text-slate-600 flex items-center justify-center shrink-0"><Icon name="xmark" /></button>
              </div>
              <div className="overflow-y-auto p-4 space-y-3 bg-slate-50 pb-10">
                {productOrders.length === 0 && <div className="text-center text-slate-400 py-4">尚無人訂購</div>}
                {productOrders.map(order => {
                  const statusConfig = STATUSES[order.status.toUpperCase()];
                  return (
                    <div key={order.id} className="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center gap-2">
                      <div className="flex-1 min-w-0">
                        <div className="font-bold text-blue-700 text-sm mb-0.5 cursor-pointer" onClick={() => { setViewProductInfo(null); setViewCustomer(order.customer); }}>
                          {order.customer}
                        </div>
                        <div className="text-[11px] text-slate-500 flex flex-wrap gap-1">
                          {order.style && <span className="bg-slate-100 px-1.5 py-0.5 rounded">款: {order.style}</span>}
                          {order.size && <span className="bg-slate-100 px-1.5 py-0.5 rounded">碼: {order.size}</span>}
                        </div>
                      </div>
                      <div className="flex flex-col items-end gap-1.5 shrink-0">
                        <div className="font-black text-slate-800">{order.quantity} 件</div>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${statusConfig.color}`}>{statusConfig.label}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen pb-24 relative">
          <header className="bg-white shadow-sm sticky top-0 z-30 border-b border-slate-200">
            <div className="max-w-5xl mx-auto px-4 h-16 flex justify-between items-center">
              <h1 className="text-xl font-extrabold text-slate-800 flex items-center gap-2 tracking-wide">
                <Icon name="store" className="text-blue-600" />
                代購旗艦系統
              </h1>
              {activeTab !== 'settings' && (
                <div className="text-sm font-medium text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                  <Icon name="chart-line" /> 利潤 ${stats.expectedProfit.toLocaleString()}
                </div>
              )}
            </div>
          </header>

          <main className="max-w-5xl mx-auto p-4">
            
            {/* ==================== 分頁 1: 商品庫 ==================== */}
            {activeTab === 'products' && (
              <div className="animate-fade-in">
                <div className="flex justify-between items-end mb-4">
                  <div>
                    <h2 className="text-lg font-bold text-slate-800">商品庫</h2>
                    <p className="text-xs text-emerald-600 font-bold"><Icon name="check" /> 已依品名排序</p>
                  </div>
                  <button onClick={() => setShowAddProduct(true)} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm flex items-center gap-1 active:scale-95 transition-transform">
                    <Icon name="plus" /> 新增
                  </button>
                </div>

                {showAddProduct && (
                  <div className="bg-white p-5 rounded-2xl shadow-lg border border-slate-200 mb-6 relative z-10">
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="font-bold text-lg">{editingProductId ? '編輯商品檔案' : '新增商品檔案'}</h3>
                      <button onClick={closeProductModal} className="p-2 bg-slate-100 rounded-full text-slate-500 flex items-center justify-center"><Icon name="xmark" /></button>
                    </div>
                    <form onSubmit={handleSaveProduct} className="space-y-4">
                      <div className="flex flex-col gap-4">
                        <div className="w-full">
                          {!newProduct.image ? (
                            <div onClick={() => fileInputRef.current?.click()} className="w-full aspect-video border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center text-slate-500 bg-slate-50">
                              <Icon name="camera" size={32} className="mb-2 text-slate-400" />
                              <span className="text-sm font-medium">拍攝或上傳商品圖</span>
                            </div>
                          ) : (
                            <div className="relative w-full aspect-video rounded-xl overflow-hidden bg-slate-100 flex items-center justify-center">
                              <img src={newProduct.image} className="w-full h-full object-contain" alt="preview" />
                              <button type="button" onClick={() => setNewProduct({...newProduct, image: null})} className="absolute top-2 right-2 bg-white/90 text-red-500 p-2 rounded-full"><Icon name="trash-can" size={14}/></button>
                            </div>
                          )}

            )}

            {/* ==================== 分頁 4: 設定與備份 ==================== */}
            {activeTab === 'settings' && (
              <div className="animate-fade-in">
                <div className="mb-4">
                  <h2 className="text-lg font-bold text-slate-800">系統設定與雲端備份</h2>
                  <p className="text-xs text-slate-500">將資料下載儲存至 Google 雲端，不再怕手機壞掉或換機</p>
                </div>

                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-4">
                  <div className="flex items-center gap-3 mb-4 text-slate-700">
                    <div className="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><Icon name="database" size={18}/></div>
                    <div>
                      <h3 className="font-bold">資料庫狀態</h3>
                      <p className="text-xs text-slate-500">目前共 {products.length} 件商品，{orders.length} 筆訂單</p>
                    </div>
                  </div>

                  <hr className="border-slate-100 my-4" />

                  <div className="space-y-4">
                    <div>
                      <h4 className="font-bold text-slate-800 text-sm mb-2"><Icon name="cloud-arrow-up" className="mr-1 text-emerald-500"/> 步驟一：備份資料</h4>
                      <p className="text-xs text-slate-500 mb-3">將目前的系統資料下載為檔案。下載後，請透過手機將該檔案儲存到您的 <b>Google 雲端硬碟</b> 或 <b>手機檔案</b> 中。</p>
                      <button onClick={downloadBackup} className="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold shadow-sm active:bg-emerald-600 flex justify-center items-center gap-2">
                        <Icon name="download" /> 下載系統備份檔
                      </button>
                    </div>

                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                      <h4 className="font-bold text-slate-800 text-sm mb-2"><Icon name="cloud-arrow-down" className="mr-1 text-blue-500"/> 步驟二：還原資料 (換手機時使用)</h4>
                      <p className="text-xs text-slate-500 mb-3">若不小心清除網頁紀錄或換新手機，點擊下方選擇您之前存到 Google 雲端的「備份檔」，即可恢復全部資料。</p>
                      
                      <input 
                        type="file" 
                        accept=".json" 
                        className="hidden" 
                        ref={importInputRef}
                        onChange={handleImportBackup} 
                      />
                      <button onClick={() => importInputRef.current?.click()} className="w-full bg-white border-2 border-blue-500 text-blue-600 py-3 rounded-xl font-bold shadow-sm active:bg-blue-50 flex justify-center items-center gap-2">
                        <Icon name="upload" /> 選擇備份檔並還原
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}
            
            {renderCustomerModal()}
            {renderProductModal()}

          </main>

          <nav className="fixed bottom-0 w-full bg-white border-t border-slate-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40 pb-safe">
            <div className="max-w-md mx-auto flex justify-between px-4 py-2">
              <button onClick={() => setActiveTab('products')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'products' ? 'text-blue-600' : 'text-slate-400'}`}>
                <Icon name="store" size={22} className="mb-1" />
                <span className="text-[10px] font-bold">商品庫</span>
              </button>
              
              <button onClick={() => setActiveTab('purchasing')} className={`flex flex-col items-center p-2 min-w-[64px] relative transition-colors ${activeTab === 'purchasing' ? 'text-blue-600' : 'text-slate-400'}`}>
                <div className="relative">
                  <Icon name="clipboard-list" size={22} className="mb-1" />
                  {stats.pendingCount > 0 && (
                    <span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center border-2 border-white">{stats.pendingCount}</span>
                  )}
                </div>
                <span className="text-[10px] font-bold">叫貨表</span>
              </button>
              
              <button onClick={() => setActiveTab('orders')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'orders' ? 'text-blue-600' : 'text-slate-400'}`}>
                <Icon name="list-ol" size={22} className="mb-1" />
                <span className="text-[10px] font-bold">訂單追蹤</span>
              </button>

              <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center p-2 min-w-[64px] transition-colors ${activeTab === 'settings' ? 'text-blue-600' : 'text-slate-400'}`}>
                <Icon name="gear" size={22} className="mb-1" />
                <span className="text-[10px] font-bold">設定</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
